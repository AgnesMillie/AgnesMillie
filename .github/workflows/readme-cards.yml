name: Update README cards

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (03:17 BRT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARD_THEME: title_color=D4AF37&icon_color=C0344D&text_color=F1E6CC&bg_color=1A1726&border_color=8C6A12&border_radius=10&locale=pt-br

    steps:
      - uses: actions/checkout@v6

      # continue-on-error + fail_on_error: a failed fetch keeps the previous SVG
      # instead of committing an error card; the last step still fails the job.
      - name: Generate stats card
        id: stats
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&ring_color=C0344D&${{ env.CARD_THEME }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        id: langs
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&${{ env.CARD_THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate pin card (eventflow-platform)
        id: pin_eventflow
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=eventflow-platform&description_lines_count=2&${{ env.CARD_THEME }}
          path: profile/pin-eventflow-platform.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate pin card (apex-monitor)
        id: pin_apex
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=apex-monitor&description_lines_count=2&${{ env.CARD_THEME }}
          path: profile/pin-apex-monitor.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate pin card (developer-snapshot-api)
        id: pin_snapshot
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=developer-snapshot-api&description_lines_count=2&${{ env.CARD_THEME }}
          path: profile/pin-developer-snapshot-api.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate pin card (Audyn-2.0)
        id: pin_audyn
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Audyn-2.0&description_lines_count=2&${{ env.CARD_THEME }}
          path: profile/pin-audyn-2.0.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test card generators
        id: tests
        continue-on-error: true
        run: node --test ".github/scripts/**/*.test.mjs"

      # Cartões desenhados no próprio repositório: não dependem de serviço
      # externo em tempo de leitura do README, só da API do GitHub aqui.
      - name: Generate activity graph
        id: activity
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node .github/scripts/gen-activity-graph.mjs "${{ github.repository_owner }}" profile/activity-graph.svg

      - name: Generate trophies card
        id: trophies
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node .github/scripts/gen-trophies.mjs "${{ github.repository_owner }}" profile/trophies.svg

      - name: Commit cards
        run: |
          if [ ! -d profile ]; then
            echo "No cards generated; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "chore: update README cards"
          git push

      - name: Report failed cards
        if: >-
          steps.stats.outcome == 'failure' ||
          steps.langs.outcome == 'failure' ||
          steps.pin_eventflow.outcome == 'failure' ||
          steps.pin_apex.outcome == 'failure' ||
          steps.pin_snapshot.outcome == 'failure' ||
          steps.pin_audyn.outcome == 'failure' ||
          steps.tests.outcome == 'failure' ||
          steps.activity.outcome == 'failure' ||
          steps.trophies.outcome == 'failure'
        run: |
          echo "::error::One or more cards failed to generate; the previous SVGs were kept."
          exit 1
