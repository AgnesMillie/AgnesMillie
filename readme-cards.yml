name: Update README cards

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC (03:17 BRT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARD_THEME: title_color=F6C21A&icon_color=D7322B&text_color=E6EDF3&bg_color=22272E&border_color=F6C21A&border_radius=12&locale=pt-br

    steps:
      - uses: actions/checkout@v6

      # continue-on-error + fail_on_error: a failed fetch keeps the previous SVG
      # instead of committing an error card; the last step still fails the job.
      - name: Generate stats card
        id: stats
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&ring_color=1F5FBF&${{ env.CARD_THEME }}
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        id: langs
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&${{ env.CARD_THEME }}
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate pin card (eventflow-platform)
        id: pin_eventflow
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=eventflow-platform&description_lines_count=2&${{ env.CARD_THEME }}
          path: profile/pin-eventflow-platform.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate pin card (apex-monitor)
        id: pin_apex
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=apex-monitor&description_lines_count=2&${{ env.CARD_THEME }}
          path: profile/pin-apex-monitor.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate pin card (developer-snapshot-api)
        id: pin_snapshot
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=developer-snapshot-api&description_lines_count=2&${{ env.CARD_THEME }}
          path: profile/pin-developer-snapshot-api.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate pin card (Audyn-2.0)
        id: pin_audyn
        continue-on-error: true
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Audyn-2.0&description_lines_count=2&${{ env.CARD_THEME }}
          path: profile/pin-audyn-2.0.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Commit cards
        run: |
          if [ ! -d profile ]; then
            echo "No cards generated; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          if git diff --cached --quiet; then
            echo "Cards unchanged."
            exit 0
          fi
          git commit -m "chore: update README cards"
          git push

      - name: Report failed cards
        if: >-
          steps.stats.outcome == 'failure' ||
          steps.langs.outcome == 'failure' ||
          steps.pin_eventflow.outcome == 'failure' ||
          steps.pin_apex.outcome == 'failure' ||
          steps.pin_snapshot.outcome == 'failure' ||
          steps.pin_audyn.outcome == 'failure'
        run: |
          echo "::error::One or more cards failed to generate; the previous SVGs were kept."
          exit 1
