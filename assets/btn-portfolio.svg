</g>
<text x="143" y="27" text-anchor="middle" font-size="13.5" fill="#EFE1CD" letter-spacing="1.6" font-family="'Avenir Next', 'Segoe UI', Inter, system-ui, -apple-system, sans-serif">OUVIR O DISCO INTEIRO</text>
