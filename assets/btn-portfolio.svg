  <circle cx="0" cy="0" r="7.9" fill="none" stroke="#EFE1CD" stroke-opacity="0.140" stroke-width="0.16"/><circle cx="0" cy="0" r="10.3" fill="none" stroke="#EFE1CD" stroke-opacity="0.080" stroke-width="0.16"/><circle cx="0" cy="0" r="12.7" fill="none" stroke="#EFE1CD" stroke-opacity="0.080" stroke-width="0.16"/>
  <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="4.7" fill="#C27049"/>
