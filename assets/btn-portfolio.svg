<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 44" width="256" height="44" role="img" aria-labelledby="t d">
<title id="t">Ouvir o disco inteiro</title>
<desc id="d">Botão: Ouvir o disco inteiro.</desc>
<defs>
<linearGradient id="brassv" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#E8C999"/><stop offset=".55" stop-color="#D9A864"/><stop offset="1" stop-color="#A97F43"/>
</linearGradient>
<linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#C27049" stop-opacity="0"/>
  <stop offset=".5" stop-color="#D9A864" stop-opacity=".75"/>
  <stop offset="1" stop-color="#C27049" stop-opacity="0"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
