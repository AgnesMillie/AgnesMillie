  }</style>
<rect x="1" y="1" width="254" height="42" rx="10" fill="#2E2122" stroke="#C27049" stroke-opacity=".6" stroke-width="1.3"/>
<rect x="5" y="5" width="246" height="34" rx="7" fill="none" stroke="#C27049" stroke-opacity=".2"/>

