  <stop offset=".5" stop-color="#E8C999" stop-opacity=".22"/>
  <stop offset="1" stop-color="#E8C999" stop-opacity="0"/>
</linearGradient>
<radialGradient id="lamp" cx="50%" cy="34%" r="80%">
