<title id="t">Agnes Millie — Engenheira de Software Sênior</title>
<desc id="d">Capa em formato de disco de vinil: o LP gira no toca-discos com o braço apoiado no sulco, uma xícara de café fumega ao lado e o nome aparece em letras de latão sobre o tapete vermelho.</desc>
<defs>
