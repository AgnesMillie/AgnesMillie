<title id="t">Rotação: contribuições do último ano</title>
<desc id="d">As contribuições por semana nos últimos doze meses (out/2025 — out/2026) desenhadas como a forma de onda de uma faixa. Total de 233 contribuições, melhor dia com 46 e média de 4,5 por semana.</desc>
