<style>
  text { font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif; }
  .pip { animation: pip 4.2s ease-in-out infinite; }
  @keyframes pip { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  /* Quem pediu menos movimento perde só os laços decorativos, nunca o conteúdo. */
  @media (prefers-reduced-motion: reduce) {
    .pip { animation: none; }
    .motion { display: none; }
  }
  .curve { fill: none; stroke: #C0344D; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#glow); }
  .trace { fill: none; stroke: #F6DC8A; stroke-width: 3.2; stroke-linecap: round; filter: url(#glow);
    stroke-dasharray: .06 .94; animation: trace 7s linear infinite; }
  @keyframes trace { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  .grid { stroke: #2A2140; stroke-width: 1; stroke-dasharray: 3 6; }
  .axis { font-size: 11px; fill: #A99CC4; letter-spacing: 1.2px; }
  .peak { animation: beat 2.6s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { r: 4.2; opacity: .95; } 50% { r: 6.6; opacity: .5; } }
  .halo { animation: halo 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes halo { 0% { transform: scale(.4); opacity: .85; } 75%, 100% { transform: scale(2.4); opacity: 0; } }</style>

